<style>
  :root {
    --background: 250 8% 10%;
    --foreground: 240 16% 90%;
    --card: 250 22% 15%;
    --card-foreground: 240 16% 90%;
    --popover: 250 22% 15%;
    --popover-foreground: 240 16% 90%;
    --primary: 258 75% 75%;
    --primary-foreground: 250 22% 12%;
    --secondary: 258 65% 65%;
    --secondary-foreground: 240 16% 95%;
    --muted: 240 8% 25%;
    --muted-foreground: 240 8% 70%;
    --accent: 198 100% 71%;
    --accent-foreground: 250 22% 12%;
    --destructive: 358 100% 76%;
    --destructive-foreground: 250 22% 12%;
    --border: 240 8% 25%;
    --input: 240 8% 25%;
    --ring: 258 75% 75%;
    --radius: 12px;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: #18171C;
    color: #E3E3E8;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
  }
  #deck { position: relative; height: 100vh; width: 100vw; }
  .slide {
    position: absolute;
    inset: 0;
    display: none;
    padding: 4rem 6rem;
    box-sizing: border-box;
    overflow: hidden;
  }
  .slide.active { display: flex; flex-direction: column; animation: fade-in 0.4s ease-out forwards; }
  .slide pre[class*='language-'] {
    background: #18171C !important;
    border: 1px solid #474753;
    border-radius: 12px;
    padding: 1.5rem 1.75rem;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 1.1rem;
    line-height: 1.6;
    box-shadow: 0px 12px 12px rgba(0,0,0,0.12), 0px 12px 12px 12px rgba(0,0,0,0.12);
  }
  .slide code[class*='language-'] { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .progress {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: linear-gradient(61deg, rgba(255,82,151,1) 0%, rgba(118,133,229,1) 50%, rgba(51,190,255,1) 100%);
    transition: width 0.3s ease;
    z-index: 50;
  }
  .chrome {
    position: fixed;
    bottom: 1.25rem;
    right: 1.5rem;
    font-size: 0.85rem;
    color: #90909A;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    z-index: 50;
  }
  .brand-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(61deg, rgba(255,82,151,1) 0%, rgba(118,133,229,1) 50%, rgba(51,190,255,1) 100%);
    opacity: 0.5;
  }
  .stagger > * { opacity: 0; animation: slide-up 0.35s ease-out forwards; }
  .stagger > *:nth-child(1) { animation-delay: 0.05s; }
  .stagger > *:nth-child(2) { animation-delay: 0.15s; }
  .stagger > *:nth-child(3) { animation-delay: 0.25s; }
  .stagger > *:nth-child(4) { animation-delay: 0.35s; }
  .stagger > *:nth-child(5) { animation-delay: 0.45s; }
  .stagger > *:nth-child(6) { animation-delay: 0.55s; }
  .stagger > *:nth-child(7) { animation-delay: 0.65s; }
  .stagger > *:nth-child(8) { animation-delay: 0.75s; }
</style>
</head>
<body class="bg-gray-black text-neutral-120 font-sans">
  <div class="progress" id="progress" style="width: 0%"></div>
  <main id="deck">
    <!-- SLIDES_PLACEHOLDER -->
  </main>
  <div class="chrome">
    <span id="counter">1 / 1</span>
    <span class="ml-3 text-neutral-40">←/→ · space · f</span>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <script>
    (function () {
      const slides = Array.from(document.querySelectorAll('.slide'));
      const counter = document.getElementById('counter');
      const progress = document.getElementById('progress');
      let i = 0;

      function render() {
        slides.forEach((s, idx) => s.classList.toggle('active', idx === i));
        counter.textContent = (i + 1) + ' / ' + slides.length;
        progress.style.width = ((i + 1) / slides.length * 100) + '%';
        if (window.Prism) Prism.highlightAll();
      }
      function next() { if (i < slides.length - 1) { i++; render(); } }
      function prev() { if (i > 0) { i--; render(); } }
      function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
        else if (e.key === 'Home') { i = 0; render(); }
        else if (e.key === 'End') { i = slides.length - 1; render(); }
        else if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
      });
      document.addEventListener('click', (e) => {
        if (e.target.closest('a, button, pre, code')) return;
        next();
      });
      render();
    })();
  </script>
</body>
