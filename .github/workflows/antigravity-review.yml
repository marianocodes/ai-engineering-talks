name: Antigravity PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code (fetch-depth 0 enables git diffing against base branch)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Install the Antigravity CLI (agy)
      - name: Install Antigravity CLI
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Step 3: Run the review using the headless -p mode
      - name: Analyze PR and generate review report
        env:
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_BRANCH: origin/${{ github.base_ref }}
          HEAD_BRANCH: origin/${{ github.head_ref }}
        run: |
          # 1. Save PR metadata and diff securely to files
          printf "%s" "$PR_TITLE" > pr_title.txt
          printf "%s" "$PR_BODY" > pr_body.txt
          git diff $BASE_BRANCH...$HEAD_BRANCH > pr_changes.diff

          # 2. Invoke the agent with a prompt directing it to read the files
          agy -p "You are Antigravity, a professional AI code reviewer. Your task is to analyze the changes in this pull request, fully understand the feature being implemented, and perform a deep review.

          Read the PR title from 'pr_title.txt', the PR description from 'pr_body.txt', and the changes from 'pr_changes.diff'.
          Because you are running in the checked-out codebase, you have full access to view other files in the workspace using your tools to understand references, helper functions, or tests.

          Please perform the following:
          1. Analyze the feature being implemented, describing its purpose and implementation strategy.
          2. Check for bugs, security concerns, performance issues, or architectural improvements.
          3. Rate the change safety with a Confidence Score from 0 to 5:
             - 5: Perfectly safe, well-tested, clean, and ready to merge.
             - 4: Safe, with minor suggestions or cleanups.
             - 3: Mostly safe, but requires validation or lacks sufficient test coverage.
             - 2: Risky, contains potential bugs, edge-case failures, or incomplete logic.
             - 1: Unsafe, contains clear bugs, design flaws, or regression risks.
             - 0: Dangerous, broken, or containing security vulnerabilities.

          Provide your response as a professional markdown report.
          Begin your report with a prominent summary block containing the safety confidence score (e.g., '**Safety Confidence Score: 4/5**') and a 2-sentence rationale." > review_report.md

      # Step 4: Comment on the Pull Request
      - name: Post comment to PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file review_report.md
